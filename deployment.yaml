apiVersion: apps/v1
kind: Deployment

metadata:
  name: simple-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: simple-web

  template:
    metadata:
      labels:
        app: simple-web

    spec:
      containers:
        - name: nginx
          image: ghcr.io/yujajja/simple-web:sha-4b26bd55d1bbacec6982011a1a6778c86f65d6d6
          ports:
            - containerPort: 80