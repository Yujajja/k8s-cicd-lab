apiVersion: apps/v1
kind: Deployment

metadata:
  name: simple-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: simple-web

  template:
    metadata:
      labels:
        app: simple-web

    spec:
      containers:
        - name: nginx
          image: ghcr.io/yujajja/simple-web:sha-93197186c12aa7287f093b9b43adc917e9603239
          ports:
            - containerPort: 80