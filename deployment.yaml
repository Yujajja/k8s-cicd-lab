apiVersion: apps/v1
kind: Deployment

metadata:
  name: simple-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: simple-web

  template:
    metadata:
      labels:
        app: simple-web

    spec:
      containers:
        - name: nginx
          image: ghcr.io/yujajja/simple-web:sha-8611704b783c1cfe55f963bd101106ac8f2b31b7
          ports:
            - containerPort: 80