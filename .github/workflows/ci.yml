name: CI - Build and Push Image

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/yujajja/simple-web:latest
            ghcr.io/yujajja/simple-web:sha-${{ github.sha }}

      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image: .*simple-web.*|image: ghcr.io/yujajja/simple-web:sha-${GITHUB_SHA}|g" deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployment.yaml
          git diff --cached --quiet || git commit -m "Update image to sha-${GITHUB_SHA}"
          git push